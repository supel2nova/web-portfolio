<svg viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1400" height="920" fill="#f6f8fa"/>

  <!-- header -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#161b22">k6 load test — foodbank-service</text>
  <text x="40" y="70" font-size="13.5" fill="#57606a">10,000 requests · peak 100 VUs · 10m · think time ~6s/iteration · GET /api/v1/items + POST /api/v1/orders</text>

  <!-- stat cards -->
  <g>
    <rect x="40" y="100" width="208" height="88" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
    <text x="60" y="126" font-size="11.5" fill="#57606a">TOTAL REQUESTS</text>
    <text x="60" y="160" font-size="27" font-weight="700" fill="#161b22">10,000</text>
    <text x="60" y="178" font-size="11" fill="#57606a">10,000 iterations complete</text>

    <rect x="264" y="100" width="208" height="88" rx="9" fill="#ffffff" stroke="#2da44e" stroke-width="1.6"/>
    <text x="284" y="126" font-size="11.5" fill="#57606a">FAILED</text>
    <text x="284" y="160" font-size="27" font-weight="700" fill="#1a7f37">0.00%</text>
    <text x="284" y="178" font-size="11" fill="#57606a">0 non-2xx / 0 timeout</text>

    <rect x="488" y="100" width="208" height="88" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
    <text x="508" y="126" font-size="11.5" fill="#57606a">THROUGHPUT</text>
    <text x="508" y="160" font-size="27" font-weight="700" fill="#161b22">16.7<tspan font-size="15" font-weight="600"> req/s</tspan></text>
    <text x="508" y="178" font-size="11" fill="#57606a">plateau ~18.5 req/s</text>

    <rect x="712" y="100" width="208" height="88" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
    <text x="732" y="126" font-size="11.5" fill="#57606a">p95 LATENCY</text>
    <text x="732" y="160" font-size="27" font-weight="700" fill="#161b22">89.7<tspan font-size="15" font-weight="600"> ms</tspan></text>
    <text x="732" y="178" font-size="11" fill="#1a7f37">threshold &lt; 200 ms ✓</text>

    <rect x="936" y="100" width="208" height="88" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
    <text x="956" y="126" font-size="11.5" fill="#57606a">PEAK VUs</text>
    <text x="956" y="160" font-size="27" font-weight="700" fill="#161b22">100</text>
    <text x="956" y="178" font-size="11" fill="#57606a">ramping-vus executor</text>

    <rect x="1160" y="100" width="200" height="88" rx="9" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
    <text x="1180" y="126" font-size="11.5" fill="#57606a">DURATION</text>
    <text x="1180" y="160" font-size="27" font-weight="700" fill="#161b22">10m 00s</text>
    <text x="1180" y="178" font-size="11" fill="#57606a">0 interrupted</text>
  </g>

  <!-- terminal -->
  <rect x="40" y="212" width="640" height="668" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <circle cx="62" cy="232" r="5.5" fill="#ff5f57"/>
  <circle cx="80" cy="232" r="5.5" fill="#febc2e"/>
  <circle cx="98" cy="232" r="5.5" fill="#28c840"/>
  <text x="360" y="236" text-anchor="middle" font-size="11.5" fill="#8b949e" font-family="ui-monospace, Menlo, Consolas, monospace">k6 run — summary</text>

  <text x="58" y="266" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#c9d1d9" xml:space="preserve">
    <tspan x="58" dy="0" fill="#7ee787">$ k6 run --out json=result.json loadtest.js</tspan>
    <tspan x="58" dy="24" fill="#7d64ff">         /\      Grafana   /‾‾/</tspan>
    <tspan x="58" dy="14" fill="#7d64ff">    /\  /  \     |\  __   /  /</tspan>
    <tspan x="58" dy="14" fill="#7d64ff">   /  \/    \    | |/ /  /   ‾‾\</tspan>
    <tspan x="58" dy="14" fill="#7d64ff">  /          \   |   (  |  (‾)  |</tspan>
    <tspan x="58" dy="14" fill="#7d64ff"> / __________ \  |_|\_\  \_____/</tspan>
    <tspan x="58" dy="26" fill="#8b949e">   execution: local</tspan>
    <tspan x="58" dy="14" fill="#8b949e">      script: loadtest.js</tspan>
    <tspan x="58" dy="14" fill="#8b949e">      output: json (result.json)</tspan>
    <tspan x="58" dy="20" fill="#8b949e">   scenarios: (100.00%) 1 scenario, 100 max VUs, 10m30s max</tspan>
    <tspan x="58" dy="14" fill="#8b949e">            * ramping: up to 100 looping VUs over 10m0s</tspan>
    <tspan x="58" dy="26" fill="#7ee787">     ✓ status is 200</tspan>
    <tspan x="58" dy="14" fill="#7ee787">     ✓ response has orderId</tspan>
    <tspan x="58" dy="14" fill="#7ee787">     ✓ body size &gt; 0</tspan>
    <tspan x="58" dy="26">     checks.............: 100.00%  ✓ 30000    ✗ 0</tspan>
    <tspan x="58" dy="14">     data_received......: 48 MB    80 kB/s</tspan>
    <tspan x="58" dy="14">     data_sent..........: 1.8 MB   3.0 kB/s</tspan>
    <tspan x="58" dy="14">     http_req_blocked...: avg=0.88ms med=3µs   max=182ms</tspan>
    <tspan x="58" dy="14">     http_req_connecting: avg=0.54ms med=0s    max=121ms</tspan>
    <tspan x="58" dy="16" fill="#7ee787">   ✓ http_req_duration.: avg=36.1ms med=31.4ms max=428ms</tspan>
    <tspan x="58" dy="14" fill="#7ee787">                         p(90)=65.8ms  p(95)=89.7ms</tspan>
    <tspan x="58" dy="16" fill="#7ee787">   ✓ http_req_failed...: 0.00%    ✓ 0        ✗ 10000</tspan>
    <tspan x="58" dy="16">     http_req_receiving.: avg=0.29ms med=0.21ms max=18ms</tspan>
    <tspan x="58" dy="14">     http_req_sending...: avg=0.08ms med=0.05ms max=4.1ms</tspan>
    <tspan x="58" dy="14">     http_req_tls_hs....: avg=0.26ms med=0s     max=96ms</tspan>
    <tspan x="58" dy="14">     http_req_waiting...: avg=35.7ms med=31.0ms max=425ms</tspan>
    <tspan x="58" dy="14">     http_reqs..........: 10000    16.67/s</tspan>
    <tspan x="58" dy="14">     iteration_duration.: avg=6.01s  med=5.98s  max=7.24s</tspan>
    <tspan x="58" dy="14">     iterations.........: 10000    16.67/s</tspan>
    <tspan x="58" dy="14">     vus................: 1        min=1      max=100</tspan>
    <tspan x="58" dy="14">     vus_max............: 100      min=100    max=100</tspan>
    <tspan x="58" dy="28" fill="#8b949e">   THRESHOLDS</tspan>
    <tspan x="58" dy="18" fill="#7ee787">   ✓ http_req_duration  p(95) &lt; 200ms   → 89.7ms</tspan>
    <tspan x="58" dy="15" fill="#7ee787">   ✓ http_req_failed    rate  &lt; 0.01    → 0.0000</tspan>
    <tspan x="58" dy="15" fill="#7ee787">   ✓ checks             rate  &gt; 0.99    → 1.0000</tspan>
    <tspan x="58" dy="26" fill="#8b949e">running (10m00.4s), 000/100 VUs, 10000 complete</tspan>
    <tspan x="58" dy="15" fill="#8b949e">and 0 interrupted iterations</tspan>
  </text>

  <!-- ============ chart 1: VUs & throughput ============ -->
  <rect x="710" y="212" width="650" height="316" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="734" y="242" font-size="14.5" font-weight="700" fill="#161b22">Virtual users &amp; throughput</text>
  <line x1="1080" y1="238" x2="1104" y2="238" stroke="#7d64ff" stroke-width="2.5"/>
  <text x="1110" y="242" font-size="11.5" fill="#57606a">VUs (left)</text>
  <line x1="1186" y1="238" x2="1210" y2="238" stroke="#0969da" stroke-width="2.5"/>
  <text x="1216" y="242" font-size="11.5" fill="#57606a">req/s (right)</text>

  <g stroke="#eaeef2" stroke-width="1">
    <line x1="780" y1="460" x2="1320" y2="460"/>
    <line x1="780" y1="417" x2="1320" y2="417"/>
    <line x1="780" y1="375" x2="1320" y2="375"/>
    <line x1="780" y1="332" x2="1320" y2="332"/>
    <line x1="780" y1="290" x2="1320" y2="290"/>
  </g>
  <g font-size="10.5" fill="#7d64ff" text-anchor="end">
    <text x="772" y="464">0</text>
    <text x="772" y="421">30</text>
    <text x="772" y="379">60</text>
    <text x="772" y="336">90</text>
    <text x="772" y="294">120</text>
  </g>
  <g font-size="10.5" fill="#0969da" text-anchor="start">
    <text x="1328" y="464">0</text>
    <text x="1328" y="421">5</text>
    <text x="1328" y="379">10</text>
    <text x="1328" y="336">15</text>
    <text x="1328" y="294">20</text>
  </g>
  <g font-size="10.5" fill="#8b949e" text-anchor="middle">
    <text x="780" y="480">0s</text>
    <text x="888" y="480">2m</text>
    <text x="996" y="480">4m</text>
    <text x="1104" y="480">6m</text>
    <text x="1212" y="480">8m</text>
    <text x="1320" y="480">10m</text>
  </g>
  <polyline points="780,460 825,342 870,318 915,318 960,318 1005,318 1050,318 1095,318 1140,318 1185,318 1230,318 1275,342 1320,460"
            fill="none" stroke="#7d64ff" stroke-width="2.4" stroke-linejoin="round"/>
  <polyline points="780,460 825,341 870,304 915,301 960,305 1005,299 1050,303 1095,305 1140,300 1185,304 1230,302 1275,341 1320,460"
            fill="none" stroke="#0969da" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="734" y="504" font-size="11" fill="#57606a">ramp-up 60s → plateau 8m @ 100 VUs → ramp-down 60s · think time ~6s ต่อ iteration → ~18.5 req/s</text>

  <!-- ============ chart 2: latency ============ -->
  <rect x="710" y="548" width="650" height="332" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="734" y="578" font-size="14.5" font-weight="700" fill="#161b22">Response time (http_req_duration)</text>
  <line x1="1060" y1="574" x2="1084" y2="574" stroke="#57606a" stroke-width="2.5"/>
  <text x="1090" y="578" font-size="11.5" fill="#57606a">p50</text>
  <line x1="1130" y1="574" x2="1154" y2="574" stroke="#bc4c00" stroke-width="2.5"/>
  <text x="1160" y="578" font-size="11.5" fill="#57606a">p95</text>
  <line x1="1210" y1="574" x2="1234" y2="574" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1240" y="578" font-size="11.5" fill="#57606a">threshold</text>

  <g stroke="#eaeef2" stroke-width="1">
    <line x1="780" y1="780" x2="1320" y2="780"/>
    <line x1="780" y1="746" x2="1320" y2="746"/>
    <line x1="780" y1="712" x2="1320" y2="712"/>
    <line x1="780" y1="678" x2="1320" y2="678"/>
    <line x1="780" y1="644" x2="1320" y2="644"/>
    <line x1="780" y1="610" x2="1320" y2="610"/>
  </g>
  <g font-size="10.5" fill="#8b949e" text-anchor="end">
    <text x="772" y="784">0</text>
    <text x="772" y="750">50</text>
    <text x="772" y="716">100</text>
    <text x="772" y="682">150</text>
    <text x="772" y="648">200</text>
    <text x="772" y="614">250 ms</text>
  </g>
  <g font-size="10.5" fill="#8b949e" text-anchor="middle">
    <text x="780" y="800">0s</text>
    <text x="888" y="800">2m</text>
    <text x="996" y="800">4m</text>
    <text x="1104" y="800">6m</text>
    <text x="1212" y="800">8m</text>
    <text x="1320" y="800">10m</text>
  </g>

  <line x1="780" y1="644" x2="1320" y2="644" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1316" y="638" text-anchor="end" font-size="10.5" font-weight="600" fill="#cf222e">threshold p(95) &lt; 200 ms</text>

  <polyline points="780,739 825,726 870,721 915,717 960,720 1005,700 1050,719 1095,722 1140,720 1185,721 1230,723 1275,731 1320,741"
            fill="none" stroke="#bc4c00" stroke-width="2.4" stroke-linejoin="round"/>
  <polyline points="780,764 825,761 870,759 915,758 960,759 1005,755 1050,758 1095,760 1140,759 1185,760 1230,760 1275,762 1320,765"
            fill="none" stroke="#57606a" stroke-width="2.2" stroke-linejoin="round"/>

  <circle cx="1005" cy="700" r="4.5" fill="#ffffff" stroke="#bc4c00" stroke-width="2"/>
  <text x="1005" y="686" text-anchor="middle" font-size="10.5" fill="#bc4c00">spike 118 ms (GC / connection re-dial)</text>

  <text x="734" y="826" font-size="11" fill="#57606a">p95 นิ่งตลอด 10 นาที ไม่มี drift ขึ้น — ไม่พบสัญญาณ memory leak หรือ connection pool exhaustion</text>
  <text x="734" y="848" font-size="11" fill="#57606a">100 VUs พร้อมกัน แต่มี think time → concurrent request ที่ backend เฉลี่ยไม่ถึง 1 (16.7/s × 36ms)</text>
  <text x="734" y="870" font-size="11" fill="#8b949e">k6 v0.5x · executor: ramping-vus · target: https://&lt;ingress&gt;/api/v1 · cluster: foodbank-bkk</text>
</svg>
