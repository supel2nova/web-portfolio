<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>404 — panupong.dev</title>
    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1116;
        --card: #181b25;
        --border: #262a37;
        --text: #e8e9ed;
        --dim: #8b8f9e;
        --accent: #ff8906;
      }
      [data-theme='light'] {
        --bg: #f7f5f0;
        --card: #ffffff;
        --border: #e3ded2;
        --text: #14171f;
        --dim: #5c5f6b;
        --accent: #d9670b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      .card {
        width: min(34rem, 100%);
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        overflow: hidden;
      }
      .bar {
        display: flex;
        gap: 0.375rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .body {
        padding: 1.75rem;
        line-height: 1.7;
      }
      .accent {
        color: var(--accent);
      }
      .dim {
        color: var(--dim);
        font-size: 0.875rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0.75rem 0 0.5rem;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.625rem 1.25rem;
        border-radius: 8px;
        background: var(--accent);
        color: #0f1116;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="bar">
        <span class="dot" style="background: #ff5f57"></span>
        <span class="dot" style="background: #febc2e"></span>
        <span class="dot" style="background: #28c840"></span>
      </div>
      <div class="body">
        <p class="dim"><span class="accent">$</span> cat page</p>
        <h1>404 — no such file or directory</h1>
        <p class="dim">The page you asked for does not exist on this server.</p>
        <a href="/">cd ~</a>
      </div>
    </div>
  </body>
</html>
